server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5436/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
#      ddl-auto: create-drop
    #  ddl-auto: create  # Используйте create для пересоздания таблицы
    # или
     ddl-auto: update  # Если хотите сохранить данные
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

logging:
  level:
    com.example.orderservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE